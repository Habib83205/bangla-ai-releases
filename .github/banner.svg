<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1280" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070612"/>
      <stop offset="50%" stop-color="#110b29"/>
      <stop offset="100%" stop-color="#09071a"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 190) rotate(25) scale(340 240)">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#4f46e5" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#070612" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1080 90) rotate(-15) scale(360 220)">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#070612" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbGrad" cx="32%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="28%" stop-color="#a78bfa"/>
      <stop offset="65%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#312e81"/>
    </radialGradient>
    <linearGradient id="orbRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="480" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1280" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8b5cf6" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- Outer Rounded Frame -->
  <rect x="2" y="2" width="1276" height="376" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>
  <rect x="2" y="2" width="1276" height="376" rx="28" fill="url(#grid)"/>

  <!-- Ambient Glows -->
  <ellipse cx="220" cy="190" rx="340" ry="220" fill="url(#glowLeft)"/>
  <ellipse cx="1080" cy="95" rx="360" ry="210" fill="url(#glowRight)"/>

  <!-- Decorative Accent Sparkles -->
  <g fill="#c4b5fd" opacity="0.65">
    <circle cx="965" cy="86" r="2.2"/>
    <circle cx="1142" cy="148" r="1.8"/>
    <circle cx="1038" cy="285" r="2"/>
    <circle cx="1192" cy="252" r="2.6"/>
    <circle cx="888" cy="296" r="1.6"/>
    <path d="M1118 76 L1121 84 L1129 87 L1121 90 L1118 98 L1115 90 L1107 87 L1115 84 Z" fill="#ddd6fe" opacity="0.85"/>
    <path d="M926 122 L928 127 L933 129 L928 131 L926 136 L924 131 L919 129 L924 127 Z" fill="#a5b4fc" opacity="0.7"/>
  </g>

  <!-- Left Luminous Bangla AI Orb Emblem -->
  <g transform="translate(155, 190)">
    <circle cx="0" cy="0" r="88" fill="#7c3aed" opacity="0.28" filter="url(#softBlur)"/>
    <circle cx="0" cy="0" r="76" fill="none" stroke="url(#orbRing)" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.7"/>
    <circle cx="0" cy="0" r="64" fill="url(#orbGrad)" stroke="#ddd6fe" stroke-opacity="0.45" stroke-width="1.5"/>
    <!-- Inner Glass Specular Highlight -->
    <ellipse cx="-20" cy="-22" rx="22" ry="13" transform="rotate(-28 -20 -22)" fill="#ffffff" opacity="0.34"/>
    <!-- 4-Point AI Sparkle Core -->
    <path d="M0 -24 C3 -7 7 -3 24 0 C7 3 3 7 0 24 C-3 7 -7 3 -24 0 C-7 -3 -3 -7 0 -24 Z" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Main Brand Typography -->
  <g transform="translate(275, 106)">
    <!-- Top Eyebrow Pill -->
    <rect x="0" y="0" width="248" height="28" rx="14" fill="url(#pillGrad)" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#34d399"/>
    <text x="29" y="18.5" fill="#ddd6fe" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.6">WINDOWS DESKTOP &amp; WORK MODE</text>

    <!-- Primary Title + Bangla Badge -->
    <text x="0" y="88" fill="url(#titleGrad)" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="60" font-weight="800" letter-spacing="-1.2">Bangla AI</text>
    <rect x="282" y="42" width="114" height="40" rx="20" fill="#7c3aed" fill-opacity="0.26" stroke="#c4b5fd" stroke-opacity="0.45" stroke-width="1.2"/>
    <text x="339" y="68" text-anchor="middle" fill="#f3e8ff" font-family="'Segoe UI', 'Nirmala UI', sans-serif" font-size="19" font-weight="700">বাংলা এআই</text>

    <!-- Subtitle -->
    <text x="2" y="126" fill="#cbd5e1" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="19" font-weight="400">
      Bilingual AI Assistant, Native Windows Desktop Agent &amp; Creative Studio for Bangladesh
    </text>

    <!-- Feature Chips Row -->
    <g transform="translate(0, 152)" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="12.5" font-weight="600">
      <rect x="0" y="0" width="176" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#c4b5fd" stroke-opacity="0.24"/>
      <text x="88" y="20.5" text-anchor="middle" fill="#e9d5ff">বাংলা • Banglish • EN</text>

      <rect x="188" y="0" width="186" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#a5b4fc" stroke-opacity="0.24"/>
      <text x="281" y="20.5" text-anchor="middle" fill="#e0e7ff">Full Desktop Control</text>

      <rect x="386" y="0" width="174" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#c4b5fd" stroke-opacity="0.24"/>
      <text x="473" y="20.5" text-anchor="middle" fill="#e9d5ff">Voice &amp; Image Studio</text>

      <rect x="572" y="0" width="166" height="32" rx="16" fill="#10b981" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.35"/>
      <text x="655" y="20.5" text-anchor="middle" fill="#a7f3d0">1-Click Silent Update</text>
    </g>

    <!-- Footer Attribution Line -->
    <text x="2" y="224" fill="#94a3b8" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="13" font-weight="500">
      Crafted by <tspan fill="#e2e8f0" font-weight="700">Habib Nabil</tspan>  •  v2.8  •  © 2026 All Rights Reserved
    </text>
  </g>
</svg>
